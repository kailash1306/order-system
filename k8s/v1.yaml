apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-v1
  template:
    metadata:
      labels:
        app: order-v1
    spec:
      containers:
        - name: order-system
          image: 24mis0218/order-system:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: order-v1-service
spec:
  type: NodePort
  selector:
    app: order-v1
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30001